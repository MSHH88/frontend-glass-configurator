<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Icons - Glassmorphism Design</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/glassmorphism-icons. css">
</head>
<body>
    <div class="container">
        <header>
            <h1>E-commerce Glassmorphism Icons</h1>
            <p class="subtitle">Beautiful glass-effect icons for your ecommerce store</p>
        </header>
        
        <main>
            <div class="icons-grid">
                <!-- Shopping Cart Icon -->
                <div class="icon-container">
                    <div class="icon-wrapper">
                        <div class="icon-hover-effect"></div>
                        <i class="icon icon-3d fas fa-shopping-cart"></i>
                    </div>
                    <span class="icon-name">Shopping Cart</span>
                </div>
                
                <!-- Heart/Saved Icon -->
                <div class="icon-container">
                    <div class="icon-wrapper">
                        <div class="icon-hover-effect"></div>
                        <i class="icon icon-3d fas fa-heart"></i>
                    </div>
                    <span class="icon-name">Saved Items</span>
                </div>
                
                <!-- Left Arrow -->
                <div class="icon-container">
                    <div class="icon-wrapper">
                        <div class="icon-hover-effect"></div>
                        <i class="icon icon-3d fas fa-chevron-left"></i>
                    </div>
                    <span class="icon-name">Previous</span>
                </div>
                
                <!-- Right Arrow -->
                <div class="icon-container">
                    <div class="icon-wrapper">
                        <div class="icon-hover-effect"></div>
                        <i class="icon icon-3d fas fa-chevron-right"></i>
                    </div>
                    <span class="icon-name">Next</span>
                </div>
                
                <!-- Trash Icon -->
                <div class="icon-container">
                    <div class="icon-wrapper">
                        <div class="icon-hover-effect"></div>
                        <i class="icon icon-3d fas fa-trash-alt"></i>
                    </div>
                    <span class="icon-name">Delete</span>
                </div>
                
                <!-- Payment Icon -->
                <div class="icon-container">
                    <div class="icon-wrapper">
                        <div class="icon-hover-effect"></div>
                        <i class="icon icon-3d fas fa-credit-card"></i>
                    </div>
                    <span class="icon-name">Checkout</span>
                </div>
                
                <!-- Hamburger Menu -->
                <div class="icon-container">
                    <div class="icon-wrapper">
                        <div class="icon-hover-effect"></div>
                        <i class="icon icon-3d fas fa-bars"></i>
                    </div>
                    <span class="icon-name">Menu</span>
                </div>
                
                <!-- Search Icon -->
                <div class="icon-container">
                    <div class="icon-wrapper">
                        <div class="icon-hover-effect"></div>
                        <i class="icon icon-3d fas fa-search"></i>
                    </div>
                    <span class="icon-name">Search</span>
                </div>
                
                <!-- User Account -->
                <div class="icon-container">
                    <div class="icon-wrapper">
                        <div class="icon-hover-effect"></div>
                        <i class="icon icon-3d fas fa-user"></i>
                    </div>
                    <span class="icon-name">Account</span>
                </div>
                
                <!-- Home Icon -->
                <div class="icon-container">
                    <div class="icon-wrapper">
                        <div class="icon-hover-effect"></div>
                        <i class="icon icon-3d fas fa-home"></i>
                    </div>
                    <span class="icon-name">Home</span>
                </div>
                
                <!-- Shipping Icon -->
                <div class="icon-container">
                    <div class="icon-wrapper">
                        <div class="icon-hover-effect"></div>
                        <i class="icon icon-3d fas fa-shipping-fast"></i>
                    </div>
                    <span class="icon-name">Shipping</span>
                </div>
                
                <!-- Wishlist -->
                <div class="icon-container">
                    <div class="icon-wrapper">
                        <div class="icon-hover-effect"></div>
                        <i class="icon icon-3d fas fa-star"></i>
                    </div>
                    <span class="icon-name">Wishlist</span>
                </div>
            </div>
        </main>
        
        <footer>
            <p>E-commerce Glassmorphism Icons | Compatible with WordPress & GitHub</p>
        </footer>
    </div>

    <script src="../glassmorphism-icons.js"></script>
</body>
</html>
