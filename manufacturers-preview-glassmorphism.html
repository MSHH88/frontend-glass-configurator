<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FenTuRo Fensterhersteller - Glassmorphism Preview</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 60px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background pattern */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(255, 255, 255, 0.05) 0%, transparent 50%);
            animation: backgroundShift 15s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes backgroundShift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(20px, 20px) scale(1.05); }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Glassmorphism heading card */
        .manufacturers-heading {
            background: rgba(255, 255, 255, 0);
            backdrop-filter: blur(1px) saturate(180%);
            -webkit-backdrop-filter: blur(1px) saturate(180%);
            border-radius: 24px;
            padding: 24px 30px;
            margin-bottom: 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 
                0 8px 32px 0 rgba(31, 38, 135, 0.15),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.3);
        }

        /* Animated gradient border */
        .manufacturers-heading::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(66, 153, 225, 0.4),
                transparent
            );
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .manufacturers-heading h2 {
            font-size: 28px;
            font-weight: 800; /* Berlin Demi Bold equivalent */
            color: #1a202c; /* Black from color scheme */
            margin: 0 0 8px 0;
            line-height: 1.2;
            position: relative;
            z-index: 1;
            letter-spacing: -0.5px;
        }

        .manufacturers-heading p {
            font-size: 14px;
            font-weight: 400;
            color: #2d3748;
            margin: 0;
            line-height: 1.4;
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
        }

        /* Manufacturer cards grid */
        .manufacturers-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 24px;
            padding: 20px 0;
        }

        .manufacturer-card {
            background: rgba(255, 255, 255, 0);
            backdrop-filter: blur(1px) saturate(180%);
            -webkit-backdrop-filter: blur(1px) saturate(180%);
            border-radius: 20px;
            padding: 30px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 
                0 8px 32px 0 rgba(31, 38, 135, 0.15),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.3);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            text-decoration: none;
            display: block;
        }

        .manufacturer-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(66, 153, 225, 0.3),
                transparent
            );
            transition: left 0.5s;
        }

        .manufacturer-card:hover::before {
            left: 100%;
        }

        .manufacturer-card:hover {
            transform: scale(1.05) translateY(-8px);
            box-shadow: 
                0 16px 48px 0 rgba(31, 38, 135, 0.25),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(2px) saturate(200%);
            -webkit-backdrop-filter: blur(2px) saturate(200%);
        }

        .manufacturer-card img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            margin-bottom: 16px;
            filter: brightness(1);
            transition: filter 0.3s;
        }

        .manufacturer-card:hover img {
            filter: brightness(1.1);
        }

        .manufacturer-card h3 {
            font-size: 20px;
            font-weight: 700;
            color: #1a202c;
            margin: 0;
            text-align: center;
            position: relative;
            z-index: 1;
        }



        /* Responsive adjustments */
        @media (max-width: 768px) {
            body {
                padding: 40px 15px;
            }

            .manufacturers-heading {
                padding: 20px 20px;
                border-radius: 20px;
            }

            .manufacturers-heading h2 {
                font-size: 22px;
            }

            .manufacturers-heading p {
                font-size: 12px;
            }

            .manufacturers-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 16px;
            }

            .manufacturer-card {
                padding: 20px;
                border-radius: 16px;
            }
        }

        @media (max-width: 480px) {
            .manufacturers-heading h2 {
                font-size: 20px;
            }

            .manufacturers-heading p {
                font-size: 11px;
            }

            .manufacturers-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Glassmorphism Heading Card -->
        <div class="manufacturers-heading">
            <h2>Die vertrauten Fensterhersteller von FenTuRo für eine klare Zukunft in Ihrem Zuhause</h2>
            <p>Qualität, die Generationen verbindet – für Ihr Zuhause und Ihre Familie</p>
        </div>

        <!-- Manufacturers Grid - All 6 in 1 Row -->
        <div class="manufacturers-grid">
            <a href="/fenster/aluplast" class="manufacturer-card">
                <img src="https://conf.fenstermaxx24.com/confapp/assets/hersteller/hersteller-aluplast-2022.webp" alt="Aluplast Fensterhersteller" loading="lazy">
                <h3>Aluplast Fenster</h3>
            </a>

            <a href="/fenster/drutex" class="manufacturer-card">
                <img src="https://conf.fenstermaxx24.com/confapp/assets/hersteller/hersteller-drutex-2022.webp" alt="Drutex Fensterhersteller" loading="lazy">
                <h3>Drutex Fenster</h3>
            </a>

            <a href="/fenster/gealan" class="manufacturer-card">
                <img src="https://conf.fenstermaxx24.com/confapp/assets/hersteller/hersteller-gealan-2022.webp" alt="Gealan Fensterhersteller" loading="lazy">
                <h3>Gealan Fenster</h3>
            </a>

            <a href="/fenster/salamander" class="manufacturer-card">
                <img src="https://conf.fenstermaxx24.com/confapp/assets/hersteller/hersteller-salamander-2022.webp" alt="Salamander Fensterhersteller" loading="lazy">
                <h3>Salamander Fenster</h3>
            </a>

            <a href="/fenster/veka" class="manufacturer-card">
                <img src="https://conf.fenstermaxx24.com/confapp/assets/hersteller/hersteller-veka-2022.webp" alt="Veka Fensterhersteller" loading="lazy">
                <h3>Veka Fenster</h3>
            </a>

            <a href="/fenster/schueco" class="manufacturer-card">
                <img src="https://cdn03.plentymarkets.com/xbqx3akj5qia/frontend/img/hersteller/schueco/schueco-logo.webp" alt="Schüco Fensterhersteller" loading="lazy">
                <h3>Schüco Fenster</h3>
            </a>
        </div>
    </div>


</body>
</html>
