<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FenTuRo - Header Preview</title>
    <style>
        /* Reset default browser styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f4;
        }

        /* Header styling */
        .site-header {
            width: 100%;
            height: 155px;
            background-color: #ffffff;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            padding: 0;
            margin: 0;
        }

        /* Logo link (hitbox) styling */
        .logo-link {
            display: block;
            height: 150px;
            margin-top: 2.5px;
            margin-left: 2.5px;
            margin-bottom: 2.5px;
            text-decoration: none;
            border: none;
            outline: none;
            padding: 0;
            line-height: 0;
            font-size: 0;
        }

        /* Logo image styling */
        .logo-image {
            height: 150px;
            width: auto;
            display: block;
            border: none;
            outline: none;
            padding: 0;
            margin: 0;
            object-fit: contain;
        }

        /* Main content area */
        main {
            padding: 20px;
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .site-header {
                height: 155px;
            }

            .logo-link {
                height: 150px;
            }

            .logo-image {
                height: 150px;
            }
        }
    </style>
</head>
<body>

    <header class="site-header">
        <a href="#" class="logo-link">
            <img src="https://files.manuscdn.com/user_upload_by_module/session_file/310419663028449717/xHNkqSOeBdZSQVyZ.webp" alt="FenTuRo Logo" class="logo-image">
        </a>
    </header>

    <main>
        <h2>Header Preview Ready</h2>
        <p>Your header is now set up with clean, professional code. The logo is referenced as a clean URL, making it easy to edit and maintain. You can now add navigation items, search bars, or other elements to the right of the logo as needed.</p>
    </main>

</body>
</html>
